name: Fix locale issues

on:
  push:
    branches: [ master ]
    paths:
      - '**.xml'
  workflow_dispatch:

concurrency:
  group: "locale"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    env:
      HAS_APP_TOKEN: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_KEY != '' }}
    steps:
    - name: Generate access token
      id: generate_token
      if: env.HAS_APP_TOKEN == 'true'
      uses: tibdex/github-app-token@v2
      with:
        app_id: ${{ secrets.GH_APP_ID }}
        private_key: ${{ secrets.GH_APP_KEY }}
        installation_retrieval_mode: repository
        installation_retrieval_payload: "recloudstream/cloudstream"
        repositories: '["recloudstream/cloudstream"]'

    - uses: actions/checkout@v6
      with:
        token: ${{ steps.generate_token.outputs.token != '' && steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}

    - name: Install dependencies
      run: pip3 install lxml requests

    - name: Edit files
      run: python3 .github/locales.py

    - name: Commit to the repo
      if: steps.generate_token.outputs.token != ''
      run: |
        git config --local user.email "111277985+recloudstream[bot]@users.noreply.github.com"
        git config --local user.name "recloudstream[bot]"
        git add .
        # "echo" returns true so the build succeeds, even if no changed files
        git commit -m 'chore(locales): fix locale issues' || echo
        git push
