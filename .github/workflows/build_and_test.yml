name: Build and Test

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: "build-and-test-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    - name: Run Unit Tests
      run: ./gradlew :app:testPrereleaseDebugUnitTest

    - name: Assemble Debug APK
      run: ./gradlew :app:assemblePrereleaseDebug
