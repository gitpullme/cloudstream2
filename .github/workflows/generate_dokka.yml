name: Dokka

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'

permissions:
  contents: read

concurrency:
  group: "dokka"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_APP_TOKEN: ${{ secrets.GH_APP_ID != '' && secrets.GH_APP_KEY != '' }}
    steps:
      - name: Generate access token
        id: generate_token
        if: env.HAS_APP_TOKEN == 'true'
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_APP_KEY }}
          installation_retrieval_mode: repository
          installation_retrieval_payload: "recloudstream/dokka"
          repositories: '["recloudstream/dokka"]'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: "src"

      - name: Checkout dokka
        if: steps.generate_token.outputs.token != ''
        uses: actions/checkout@v6
        with:
          repository: "recloudstream/dokka"
          path: "dokka"
          token: ${{ steps.generate_token.outputs.token }}

      - name: Clean old builds
        if: steps.generate_token.outputs.token != ''
        run: |
          cd $GITHUB_WORKSPACE/dokka/
          rm -rf "./app"
          rm -rf "./library"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Generate Dokka
        run: |
          cd $GITHUB_WORKSPACE/src/
          chmod +x gradlew
          ./gradlew docs:dokkaGeneratePublicationHtml

      - name: Copy Dokka
        if: steps.generate_token.outputs.token != ''
        run: cp -r $GITHUB_WORKSPACE/src/docs/build/dokka/html/* $GITHUB_WORKSPACE/dokka/

      - name: Push builds
        if: steps.generate_token.outputs.token != ''
        run: |
          cd $GITHUB_WORKSPACE/dokka
          touch .nojekyll
          git config --local user.email "111277985+recloudstream[bot]@users.noreply.github.com"
          git config --local user.name "recloudstream[bot]"
          git add .
          git commit -m 'Docs build'
          git push
